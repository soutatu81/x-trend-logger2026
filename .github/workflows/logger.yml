name: X Trend Logger

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 💡 ここでGitHub Actionsに書き込み権限を与える
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Pythonスクリプトの実行
        run: python main.py

      - name: 変更を自動コミットしてプッシュ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update trend log [skip ci]"
          file_pattern: "trend_log.csv"
